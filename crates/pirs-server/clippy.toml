# D-09: only `pirs_server::process` may construct commands; it carries a
# module-level `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "spawn through pirs_server::process::std_command (src/process.rs) so every child the server starts goes through one place (D-09)" },
    { path = "tokio::process::Command::new", reason = "spawn through pirs_server::process::tokio_command (src/process.rs) so every child the server starts goes through one place (D-09)" },
]
