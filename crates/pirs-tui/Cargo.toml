[package]
name = "pirs-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The pirs reference UI: a sidebar of agents and pages, as a client of the loop server."

[dependencies]
pirs-protocol = { path = "../pirs-protocol" }
pirs-client = { path = "../pirs-client" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
dirs.workspace = true
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"

[dev-dependencies]
