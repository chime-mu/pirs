[package]
name = "pirs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The pirs command: print mode, the loop server, the small administrative commands and the UI."

[[bin]]
name = "pirs"
path = "src/main.rs"

[dependencies]
pirs-protocol = { path = "../pirs-protocol" }
pirs-client = { path = "../pirs-client" }
pirs-server = { path = "../pirs-server" }
pirs-tui = { path = "../pirs-tui" }
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
futures.workspace = true
nix = { version = "0.29", features = ["signal"] }
serde_json.workspace = true
tokio.workspace = true
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
