<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello there!</title>
<style>
  :root {
    --bg1: #6a11cb;
    --bg2: #2575fc;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(-45deg, var(--bg1), var(--bg2), #ff6a88, #ffb86c);
    background-size: 400% 400%;
    animation: drift 18s ease infinite;
    color: #fff;
    padding: 1.5rem;
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 22px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 34rem;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: rise 0.8s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  .wave {
    font-size: 4rem;
    display: inline-block;
    transform-origin: 70% 70%;
    animation: wave 2.4s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 60%, 100% { transform: rotate(0deg); }
    10%, 30% { transform: rotate(14deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(-4deg); }
    50% { transform: rotate(10deg); }
  }
  h1 {
    margin: 0.5rem 0 0.25rem;
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -0.02em;
  }
  p.sub {
    margin: 0 0 1.75rem;
    font-size: 1.05rem;
    opacity: 0.9;
  }
  #quote {
    min-height: 3.2em;
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 1.75rem;
    transition: opacity .3s ease;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #2b2b4a;
    background: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.85rem 1.8rem;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(0,0,0,.28); }
  button:active { transform: translateY(0); }
  footer {
    margin-top: 1.5rem;
    font-size: .85rem;
    opacity: .75;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="wave" role="img" aria-label="waving hand">👋</span>
    <h1 id="greeting">Hello, friend!</h1>
    <p class="sub" id="timestamp"></p>
    <p id="quote">It's genuinely nice to see you here today.</p>
    <button id="cheer" type="button">Cheer me up ✨</button>
    <footer>Made with care — a single, standalone HTML file.</footer>
  </main>

<script>
  (function () {
    var greetingEl  = document.getElementById('greeting');
    var timestampEl = document.getElementById('timestamp');
    var quoteEl     = document.getElementById('quote');
    var button      = document.getElementById('cheer');

    var hour = new Date().getHours();
    var partOfDay =
      hour < 5  ? 'night owl' :
      hour < 12 ? 'morning'   :
      hour < 18 ? 'afternoon' :
                  'evening';

    greetingEl.textContent = partOfDay === 'night owl'
      ? 'Hello, night owl!'
      : 'Good ' + partOfDay + ', friend!';

    timestampEl.textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    var messages = [
      "It's genuinely nice to see you here today.",
      "You've got this — one small step at a time.",
      "Somewhere, a semicolon is grateful for you.",
      "Take a breath. You're doing better than you think.",
      "Today is a great day to build something small and delightful.",
      "Progress beats perfection, every single time.",
      "Hope your coffee is warm and your builds are green.",
      "Curiosity looks good on you."
    ];

    var last = -1;
    button.addEventListener('click', function () {
      var i;
      do { i = Math.floor(Math.random() * messages.length); } while (i === last && messages.length > 1);
      last = i;
      quoteEl.style.opacity = '0';
      setTimeout(function () {
        quoteEl.textContent = messages[i];
        quoteEl.style.opacity = '1';
      }, 200);
    });
  })();
</script>
</body>
</html>
